# Release workflow for the liked/subscribed-only fork.
name: Build Allowed-Only APKs

on:
  push:
    branches: [main]
    paths:
      - x.js
      - cobalt/shell/embedded_resources/cobalt_java_script_polyfill/tizentube_allowed_only_loader.js
      - tools/tizentube_allowed_only_test.js
      - tools/tizentube_library_allowlist_test.js
      - tools/onn_cast_bridge_test.js
      - tools/onn_key_guard/**
      - tools/tizentube_boot_recovery_test.js
      - tools/signing_identity_test.js
      - tools/verify_signing_identity.js
      - tools/release-signing-fingerprint.txt
      - tools/patch_allowed_only_apk.py
      - .github/workflows/allowed-only-release.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (must not already exist)'
        required: false
        default: 'allowed-only-v1'

permissions:
  contents: write

concurrency:
  group: allowed-only-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            x.js
            tools
            cobalt/shell/embedded_resources/cobalt_java_script_polyfill

      - name: Run filter unit tests
        run: node tools/tizentube_allowed_only_test.js && node tools/tizentube_library_allowlist_test.js && node tools/onn_cast_bridge_test.js && node tools/signing_identity_test.js && node tools/tizentube_boot_recovery_test.js && python3 tools/patch_allowed_only_apk_test.py

      - name: Download upstream v2.0.2 APKs
        run: |
          mkdir -p dist work
          curl -L --fail --retry 4 --retry-all-errors \
            -o work/upstream-arm.apk \
            https://github.com/reisxd/TizenTubeCobalt/releases/download/v2.0.2/cobalt-arm.apk
          curl -L --fail --retry 4 --retry-all-errors \
            -o work/upstream-arm64.apk \
            https://github.com/reisxd/TizenTubeCobalt/releases/download/v2.0.2/cobalt-arm64.apk
          echo 'ff90c6e85c37246b809cca80282910509782c1384eccfbb6066da3b497dd9fd2  work/upstream-arm.apk' | sha256sum -c -
          echo '0e8a9cffc77a08cd116d38e262c3e9d7f261ba2093b5b2d2ef905f509c99133c  work/upstream-arm64.apk' | sha256sum -c -

      - name: Patch document-start filter and fork package id
        env:
          FILTER_URL: https://cdn.jsdelivr.net/gh/YossiMH/TizenTubeCobalt@${{ github.sha }}/x.js
        run: |
          python3 tools/patch_allowed_only_apk.py work/upstream-arm.apk work/arm-unsigned.apk --script-url "$FILTER_URL"
          python3 tools/patch_allowed_only_apk.py work/upstream-arm64.apk work/arm64-unsigned.apk --script-url "$FILTER_URL"

      - name: Locate Android build tools
        id: android-tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          BUILD_TOOLS_VERSION=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n1)
          echo "dir=$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION" >> "$GITHUB_OUTPUT"
          "$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner" version

      - name: Restore persistent fork signing key
        env:
          KS_B64: ${{ secrets.ALLOWED_ONLY_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ALLOWED_ONLY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Persistent signing key is not configured. Refusing to build with a throwaway key: future releases would not install over previous installs. Configure ALLOWED_ONLY_KEYSTORE_BASE64 and ALLOWED_ONLY_KEYSTORE_PASSWORD from the private key backup. The expected identity is pinned in tools/release-signing-fingerprint.txt."
            exit 1
          fi
          echo "$KS_B64" > work/keystore.b64
          printf '%s' "$KS_PASS" > work/keystore.pass
          node tools/verify_signing_identity.js work/keystore.b64 work/keystore.pass tools/release-signing-fingerprint.txt
          base64 -d work/keystore.b64 > work/allowed-only.keystore

      - name: Align, sign, and statically verify APKs
        env:
          BT: ${{ steps.android-tools.outputs.dir }}
          KS_PASS: ${{ secrets.ALLOWED_ONLY_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sign_one() {
            in_apk="$1"
            out_apk="$2"
            aligned="${in_apk%.apk}-aligned.apk"
            "$BT/zipalign" -p -f 4 "$in_apk" "$aligned"
            "$BT/apksigner" sign \
              --ks work/allowed-only.keystore \
              --ks-key-alias allowedonly \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KS_PASS" \
              --out "$out_apk" "$aligned"
            "$BT/apksigner" verify --verbose --print-certs "$out_apk"
            "$BT/zipalign" -c -p 4 "$out_apk"
            "$BT/aapt" dump badging "$out_apk" | tee "$out_apk.badging.txt"
            grep -q "package: name='io.gh.yossim.tizentube.cobalt'" "$out_apk.badging.txt"
            grep -q "application-label:'TizenSub+'" "$out_apk.badging.txt"
          }
          sign_one work/arm-unsigned.apk dist/TizenTube-Liked-Subs-arm.apk
          sign_one work/arm64-unsigned.apk dist/TizenTube-Liked-Subs-arm64.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Verify signed APK certificate matches pinned identity
        env:
          BT: ${{ steps.android-tools.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          expected=$(awk -F'SHA256:' '/^SHA256:/{print $2}' tools/release-signing-fingerprint.txt | tr -d ':' | tr 'a-f' 'A-F')
          for apk in dist/TizenTube-Liked-Subs-arm.apk dist/TizenTube-Liked-Subs-arm64.apk; do
            actual=$("$BT/apksigner" verify --print-certs "$apk" | grep -i 'SHA-256' | sed -E 's/.*digest: *//' | tr -d ':' | tr 'a-f' 'A-F')
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk certificate fingerprint $actual does not match pinned identity $expected"
              exit 1
            fi
            echo "$apk certificate matches pinned signing identity"
          done

      - name: Verify pinned native filter URL is present
        env:
          EXPECTED_URL: https://cdn.jsdelivr.net/gh/YossiMH/TizenTubeCobalt@${{ github.sha }}/x.js
        run: |
          python3 - <<'PY'
          import os, zipfile
          from tools.patch_allowed_only_apk import pinned_cdn_url
          expected = pinned_cdn_url(os.environ['EXPECTED_URL'], 9).encode()
          for apk in ['dist/TizenTube-Liked-Subs-arm.apk', 'dist/TizenTube-Liked-Subs-arm64.apk']:
              with zipfile.ZipFile(apk) as z:
                  libs = [n for n in z.namelist() if n.endswith('/libchrobalt.so')]
                  assert libs, apk
                  hits = sum(z.read(n).count(expected) for n in libs)
                  assert hits == 1, (apk, libs, hits)
                  print(apk, 'contains pinned native filter URL in', libs)
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TizenTube-Liked-Subs-APKs
          path: |
            dist/TizenTube-Liked-Subs-arm.apk
            dist/TizenTube-Liked-Subs-arm64.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

  emulator-smoke:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TizenTube-Liked-Subs-APKs
          path: dist

      - name: Boot Android 11 emulator, install ARM APK, and launch
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: false
          script: |
            adb shell getprop ro.product.cpu.abilist | tr -d '\r' | tee /tmp/tizentube-abis.txt
            grep -q 'armeabi-v7a' /tmp/tizentube-abis.txt
            adb logcat -c
            adb install --no-streaming -r dist/TizenTube-Liked-Subs-arm.apk || { adb logcat -d > /tmp/tizentube-logcat.txt; adb logcat -b crash -d > /tmp/tizentube-crash.txt; exit 1; }
            adb shell cmd package resolve-activity --brief io.gh.yossim.tizentube.cobalt | tr -d '\r' | tail -n1 | tee /tmp/tizentube-activity.txt
            test -s /tmp/tizentube-activity.txt
            adb logcat -c
            adb shell am start -W -n "$(cat /tmp/tizentube-activity.txt)"
            sleep 12
            adb shell pidof io.gh.yossim.tizentube.cobalt
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
            adb exec-out screencap -p > /tmp/tizentube-smoke.png
            adb logcat -d > /tmp/tizentube-logcat.txt
            adb logcat -b crash -d > /tmp/tizentube-crash.txt
            ! grep -q 'io.gh.yossim.tizentube.cobalt' /tmp/tizentube-crash.txt

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-evidence
          path: |
            /tmp/tizentube-smoke.png
            /tmp/tizentube-logcat.txt
            /tmp/tizentube-crash.txt
            /tmp/tizentube-abis.txt
            /tmp/tizentube-activity.txt
          if-no-files-found: ignore

  release:
    needs: [build, emulator-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TizenTube-Liked-Subs-APKs
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'allowed-only-v1' }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; keeping it immutable. Re-run with a new release_tag input to publish a new version."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'TizenTube Liked + Subscriptions' \
            --notes 'Based on upstream TizenTube Cobalt v2.0.2. Video discovery and playback are filtered at document start so only videos in the signed-in account Liked videos list or from subscribed channels are exposed. The APKs use package io.gh.yossim.tizentube.cobalt so they can be installed beside upstream TizenTube. Releases are signed with the project persistent signing key so future releases install over previous ones.' \
            dist/TizenTube-Liked-Subs-arm.apk \
            dist/TizenTube-Liked-Subs-arm64.apk \
            dist/SHA256SUMS.txt
